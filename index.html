<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CO – Copilot Anker</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .box {
            background: #222;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        h1, h2 {
            color: #4af;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <h1>CO – Copilot Anker</h1>

    <div class="box">
        <h2>Systemstatus</h2>
        <pre id="status">Starte CO…</pre>
    </div>

    <div class="box">
        <h2>SDSA Achsen</h2>
        <pre id="sdsa">SDSA wird geladen…</pre>
    </div>

    <div class="box">
        <h2>RESPO Log</h2>
        <pre id="respo">RESPO wird gestartet…</pre>
    </div>

    <div class="box">
        <h2>PQ Copilot</h2>
        <pre id="pq">PQ Copilot wartet…</pre>
    </div>

    <div class="box">
        <h2>PP Copilot</h2>
        <pre id="pp">PP Copilot wartet…</pre>
    </div>

    <script type="module">
        import { RESPO } from "./src/respo/respo-core.js";
        import { CO } from "./src/co/co.js";

        const statusBox = document.getElementById("status");
        const sdsaBox = document.getElementById("sdsa");
        const respoBox = document.getElementById("respo");
        const pqBox = document.getElementById("pq");
        const ppBox = document.getElementById("pp");

        function log(box, msg) {
            box.textContent += "\n" + msg;
        }

        function startCO() {
            log(statusBox, "RESPO wird initialisiert…");

            const co = CO.boot(RESPO);
            log(statusBox, "CO Copilot gestartet.");

            const sdsa = co.sdsa;
            sdsaBox.textContent = JSON.stringify(sdsa, null, 2);

            log(respoBox, "SDSA erklärt:");
            log(respoBox, JSON.stringify(RESPO.explainSDSA(), null, 2));

            log(pqBox, "PQ Copilot aktiv:");
            log(pqBox, co.pqCopilot.advise("Systemstart"));

            log(ppBox, "PP Copilot aktiv:");
            log(ppBox, co.ppCopilot.optimize("Initialisierung"));

            log(statusBox, "System vollständig aktiv.");
        }

        startCO();
    </script>

</body>
</html>
