<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CO Copilot Instance</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./CSS/AG.css">
</head>

<body>

<h1>CO Copilot Instance</h1>
<div id="status">Wird geladen…</div>

<h2>Orbit‑Continuum</h2>
<div class="orbit-panel">
    <div class="orbit-button" id="orbitNC">NC Orbit</div>
    <div class="orbit-button" id="orbitCO">CO Orbit</div>
    <div class="orbit-button" id="orbitAGENT">AGENT Orbit</div>
    <div class="orbit-button" id="orbitRESPO">RESPO Orbit</div>
    <div class="orbit-button" id="orbitSDSA">SDSA Orbit</div>
    <div class="orbit-button" id="orbitPipeline">Pipeline Orbit</div>
    <div class="orbit-button" id="orbitPQ">PQ Orbit</div>
    <div class="orbit-button" id="orbitPP">PP Orbit</div>
    <div class="orbit-button" id="orbitMatrix">Matrix Orbit</div>
</div>

<h2>NC Module</h2>
<button id="ncPredict">NC Predict</button>
<button id="ncAnalyse">NC Analyse</button>
<button id="ncFlowBoost">NC Flow Booster</button>
<button id="ncRespoRouter">NC RESPO Router</button>
<button id="ncPipelineAuto">NC Pipeline Auto</button>
<button id="ncStabilisationMonitor">NC Stabilisations‑Monitor</button>

<pre id="ncOutput"></pre>

<h2>Matrix</h2>
<button id="matrixRefresh">Matrix aktualisieren</button>
<div id="matrix" class="matrix"></div>

<script type="module" src="./runtime/RUN.js"></script>
</body>
</html>
