<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CO – Copilot Anker</title>
</head>
<body>

    <h1>CO – Copilot Anker</h1>
    <pre id="status">Starte CO…</pre>
    <pre id="sdsa">SDSA wird geladen…</pre>
    <pre id="respo">RESPO Log…</pre>

    <script type="module">
        import { RESPO } from "./src/respo/respo-core.js";
        import { CO } from "./src/co/co.js";

        const statusBox = document.getElementById("status");
        const sdsaBox = document.getElementById("sdsa");
        const respoBox = document.getElementById("respo");

        function log(box, msg) {
            box.textContent += "\n" + msg;
        }

        function startCO() {
            log(statusBox, "RESPO wird initialisiert…");

            const co = CO.boot(RESPO);
            log(statusBox, "CO Copilot gestartet.");

            const sdsa = RESPO.loadSDSA();
            sdsaBox.textContent = JSON.stringify(sdsa, null, 2);

            log(respoBox, "SDSA erklärt:");
            log(respoBox, JSON.stringify(RESPO.explainSDSA(), null, 2));

            log(statusBox, "System vollständig aktiv.");
        }

        startCO();
    </script>

</body>
</html>
